media:
  input: assets/images
  output: /assets/images

content:
  - name: samosber
    label: Samosběr
    type: file
    path: data/samosber.json
    format: json
    fields:
      - name: enabled
        label: Zobrazit nabídku samosběru
        type: boolean
        required: true
        description: Vypnutím se nabídka i termíny skryjí z webu.

      - name: booking_enabled
        label: Povolit e-mailovou rezervaci
        type: boolean
        required: true
        description: Vypnutím se skryje rezervační formulář, termíny mohou zůstat viditelné.

      - name: announcement
        label: Text v horním proužku
        type: string
        required: true
        description: Krátká aktuální informace zobrazená úplně nahoře na webu.
        options:
          maxlength: 120

      - name: offer_label
        label: Štítek nabídky
        type: string
        required: true
        description: Například Předběžná nabídka nebo Samosběr otevřen.
        options:
          maxlength: 50

      - name: title
        label: Nadpis nabídky
        type: string
        required: true
        description: Například Samosběr švestek · září 2026.
        options:
          maxlength: 90

      - name: description
        label: Popis nabídky
        type: text
        required: true
        options:
          maxlength: 300

      - name: time_summary
        label: Souhrnný čas
        type: string
        description: Krátký údaj v pravé části nabídky, například 8:00–11:30.
        options:
          maxlength: 40

      - name: confirmation_title
        label: Nadpis upozornění
        type: string
        required: true
        options:
          maxlength: 100

      - name: confirmation_note
        label: Text upozornění
        type: text
        required: true
        options:
          maxlength: 300

      - name: empty_message
        label: Text při nulovém počtu termínů
        type: text
        required: true
        options:
          maxlength: 240

      - name: allow_other_term
        label: Nabídnout volbu Jiný termín
        type: boolean
        required: true

      - name: slots
        label: Termíny
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} · {fruit} · {status}"
        fields:
          - name: visible
            label: Zobrazit termín
            type: boolean
            required: true
            description: Vypnutý termín zůstane uložený, ale návštěvníci jej neuvidí.

          - name: date
            label: Datum
            type: date
            required: true
            options:
              format: yyyy-MM-dd

          - name: start
            label: Čas od
            type: string
            required: true
            description: Zapisujte ve formátu 08:00.
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: Použijte čas ve formátu 08:00.

          - name: end
            label: Čas do
            type: string
            required: true
            description: Zapisujte ve formátu 11:30.
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: Použijte čas ve formátu 11:30.

          - name: fruit
            label: Ovoce
            type: select
            required: true
            options:
              values:
                - name: Švestky
                  label: Švestky
                - name: Meruňky
                  label: Meruňky
                - name: Černý rybíz
                  label: Černý rybíz
                - name: Jablka
                  label: Jablka
                - name: Jiné
                  label: Jiné

          - name: status
            label: Stav termínu
            type: select
            required: true
            options:
              values:
                - name: preliminary
                  label: Předběžný – čeká na potvrzení zralosti
                - name: open
                  label: Otevřený – lze rezervovat
                - name: full
                  label: Obsazený
                - name: closed
                  label: Rezervace uzavřena
                - name: cancelled
                  label: Zrušený

          - name: note
            label: Krátká poznámka ke stavu
            type: string
            description: Například Posledních 10 míst. Prázdné pole použije výchozí text podle stavu.
            options:
              maxlength: 90

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: "Aktualizace nabídky samosběru"
