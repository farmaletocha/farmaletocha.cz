content:
  - name: nabidka
    label: Nabídka a prodej
    type: file
    path: data/nabidka.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - name: enabled
        label: Zobrazit aktuální nabídku
        type: boolean
        required: true
        description: Skryje jen aktuální nabídku a cenu, nikoli ovoce nebo samosběr.
      - name: title
        label: Nadpis nabídky
        type: string
        required: true
      - name: price
        label: Cena nebo cenové rozpětí
        type: string
        required: true
        description: Například 10–24.
      - name: price_subject
        label: Ovoce, ke kterému se cena vztahuje
        type: string
        required: true
        description: Například Jablka. Uvádí se u ceny v automatické odpovědi, aby nešlo o univerzální cenu všeho ovoce.
      - name: unit
        label: Jednotka ceny
        type: string
        required: true
        description: Například Kč/kg.
      - name: price_note
        label: Poznámka k ceně
        type: string
        required: true
      - name: hours
        label: Prodejní doba
        type: string
        required: true
        description: Zobrazí se v nabídce, úvodu, kontaktu a automatické odpovědi ve FAQ.
      - name: arrangement
        label: Domluva mimo prodejní dobu
        type: string
        required: true
      - name: varieties
        label: Ovoce a odrůdy v aktuální nabídce
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {status}"
        fields:
          - name: name
            label: Ovoce nebo odrůda
            type: string
            required: true
          - name: status
            label: Dostupnost
            type: string
            required: true
            description: Například V prodeji, Od října nebo Vyprodáno.
          - name: sold_out
            label: Vyprodáno
            type: boolean
            required: true
            description: Zvýrazní stav jako vyprodaný, položku neodstraní.
          - name: description
            label: Popis
            type: text
            required: true

  - name: web
    label: Texty a kontakty
    type: file
    path: data/web.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - name: contact
        label: Kontakt a příjezd
        type: object
        required: true
        fields:
          - name: name
            label: Kontaktní osoba
            type: string
            required: true
          - name: phone
            label: Telefon
            type: string
            required: true
            description: Včetně předvolby, bez mezer. Aktualizuje telefon v kontaktech a patičce.
            pattern:
              regex: '^\+[1-9][0-9]{6,14}$'
              message: Použijte mezinárodní formát, například +420602793987.
          - name: email
            label: E-mail
            type: string
            required: true
            description: Hlavní kontaktní adresa pro tlačítka na webu i žádosti o rezervaci.
            pattern:
              regex: '^[^\s@<>?&#]+@[^\s@<>?&#]+\.[^\s@<>?&#]+$'
              message: Zadejte platnou e-mailovou adresu.
          - name: locality
            label: Obec
            type: string
            required: true
          - name: address
            label: Adresa farmy
            type: string
            required: true
          - name: postal_code
            label: PSČ
            type: string
            required: true
          - name: latitude
            label: Zeměpisná šířka pro navigaci
            type: number
            required: true
            description: První souřadnice z mapy, například 49.6802067.
            options: { min: -90, max: 90, step: 0.0000001 }
          - name: longitude
            label: Zeměpisná délka pro navigaci
            type: number
            required: true
            description: Druhá souřadnice z mapy, například 17.3246451. Obě souřadnice určují mapu i navigaci.
            options: { min: -180, max: 180, step: 0.0000001 }
          - name: location_text
            label: Kde nás najdete
            type: text
            required: true
          - name: directions
            label: Informace k příjezdu
            type: text
            required: true
      - name: intro
        label: Úvodní část
        type: object
        required: true
        fields:
          - name: location
            label: Lokalita nad nadpisem
            type: string
            required: true
          - name: title
            label: První řádek nadpisu
            type: string
            required: true
          - name: subtitle
            label: Druhý řádek nadpisu
            type: string
            required: true
          - name: description
            label: Úvodní text
            type: text
            required: true
          - name: rotate_fruit
            label: Automaticky střídat fotografie ovoce
            type: boolean
            required: true
            description: Střídá všechny čtyři druhy ovoce s jejich popisky. Návštěvník může střídání pozastavit.
      - name: story
        label: O farmě
        type: object
        required: true
        fields:
          - name: title
            label: Nadpis
            type: string
            required: true
          - name: lead
            label: Úvodní odstavec
            type: text
            required: true
          - name: description
            label: Hlavní text
            type: text
            required: true
      - name: fruit
        label: Ovoce a popisky úvodních fotografií
        type: object
        required: true
        fields:
          - name: apples
            label: Jablka
            type: object
            required: true
            fields:
              - name: name
                label: Název
                type: string
                required: true
              - name: season
                label: Období sklizně
                type: string
                required: true
              - name: months
                label: Měsíce sezony
                type: select
                required: true
                options: &season-months
                  multiple: true
                  values: &month-values
                    - { name: "1", label: Leden }
                    - { name: "2", label: Únor }
                    - { name: "3", label: Březen }
                    - { name: "4", label: Duben }
                    - { name: "5", label: Květen }
                    - { name: "6", label: Červen }
                    - { name: "7", label: Červenec }
                    - { name: "8", label: Srpen }
                    - { name: "9", label: Září }
                    - { name: "10", label: Říjen }
                    - { name: "11", label: Listopad }
                    - { name: "12", label: Prosinec }
              - name: description
                label: Popis ovoce
                type: text
                required: true
              - name: varieties
                label: Pěstované odrůdy
                type: string
                list: true
                required: true
              - name: hero_title
                label: Nadpis u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 65 }
              - name: hero_description
                label: Druhý řádek u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 100 }
          - name: apricots
            label: Meruňky
            type: object
            required: true
            fields:
              - name: name
                label: Název
                type: string
                required: true
              - name: season
                label: Období sklizně
                type: string
                required: true
              - name: months
                label: Měsíce sezony
                type: select
                required: true
                options: *season-months
              - name: description
                label: Popis ovoce
                type: text
                required: true
              - name: hero_title
                label: Nadpis u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 65 }
              - name: hero_description
                label: Druhý řádek u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 100 }
          - name: blackcurrants
            label: Černý rybíz
            type: object
            required: true
            fields:
              - name: name
                label: Název
                type: string
                required: true
              - name: season
                label: Období sklizně
                type: string
                required: true
              - name: months
                label: Měsíce sezony
                type: select
                required: true
                options: *season-months
              - name: description
                label: Popis ovoce
                type: text
                required: true
              - name: hero_title
                label: Nadpis u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 65 }
              - name: hero_description
                label: Druhý řádek u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 100 }
          - name: plums
            label: Švestky
            type: object
            required: true
            fields:
              - name: name
                label: Název
                type: string
                required: true
              - name: season
                label: Období sklizně
                type: string
                required: true
              - name: months
                label: Měsíce sezony
                type: select
                required: true
                options: *season-months
              - name: description
                label: Popis ovoce
                type: text
                required: true
              - name: hero_title
                label: Nadpis u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 65 }
              - name: hero_description
                label: Druhý řádek u úvodní fotografie
                type: string
                required: true
                options: { maxlength: 100 }
      - name: trees
        label: Ovocné stromky
        type: object
        required: true
        fields:
          - name: title
            label: Nadpis
            type: string
            required: true
          - name: description
            label: Nabídka a podmínky
            type: text
            required: true
      - name: calendar
        label: Kalendář sklizně
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{month} · {title}"
        fields:
          - name: month
            label: Měsíc
            type: select
            required: true
            options:
              multiple: false
              values: *month-values
          - name: title
            label: Nadpis
            type: string
            required: true
          - name: description
            label: Popis
            type: text
            required: true
          - name: fruits
            label: Ovoce v daném měsíci
            type: select
            required: true
            options:
              multiple: true
              values:
                - { name: apples, label: Jablka }
                - { name: apricots, label: Meruňky }
                - { name: blackcurrants, label: Černý rybíz }
                - { name: plums, label: Švestky }

  - name: faq
    label: Časté otázky
    type: file
    path: data/faq.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - name: items
        label: Otázky a odpovědi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: visible
            label: Zobrazit otázku
            type: boolean
            required: true
          - name: question
            label: Otázka
            type: string
            required: true
          - name: answer_source
            label: Odkud vzít odpověď
            type: select
            required: true
            options:
              values:
                - { name: text, label: Vlastní odpověď napsaná níže }
                - { name: availability, label: Automaticky podle aktuální nabídky }
                - { name: sales, label: Automaticky podle ceny a prodejní doby }
          - name: answer
            label: Vlastní odpověď
            type: text
            description: Vyplňte při volbě Vlastní odpověď. Automatické odpovědi se mění podle položky Nabídka a prodej.

  - name: samosber
    label: Samosběr
    type: file
    path: data/samosber.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - name: enabled
        label: Zobrazit nabídku samosběru
        type: boolean
        required: true
        description: Vypnutím se nabídka i termíny skryjí z webu.

      - name: booking_enabled
        label: Povolit e-mailovou rezervaci
        type: boolean
        required: true
        description: Vypnutím se skryje rezervační formulář, termíny mohou zůstat viditelné.

      - name: announcement
        label: Text v horním proužku
        type: string
        required: true
        description: Krátká aktuální informace zobrazená úplně nahoře na webu.
        options:
          maxlength: 120

      - name: offer_label
        label: Štítek nabídky
        type: string
        required: true
        description: Například Předběžná nabídka nebo Samosběr otevřen.
        options:
          maxlength: 50

      - name: title
        label: Nadpis nabídky
        type: string
        required: true
        description: Například Samosběr švestek · září 2026.
        options:
          maxlength: 90

      - name: description
        label: Popis nabídky
        type: text
        required: true
        options:
          maxlength: 300

      - name: time_summary
        label: Souhrnný čas
        type: string
        description: Krátký údaj v pravé části nabídky, například 8:00–11:30.
        options:
          maxlength: 40

      - name: confirmation_title
        label: Nadpis upozornění
        type: string
        required: true
        options:
          maxlength: 100

      - name: confirmation_note
        label: Text upozornění
        type: text
        required: true
        options:
          maxlength: 300

      - name: empty_message
        label: Text při nulovém počtu termínů
        type: text
        required: true
        options:
          maxlength: 240

      - name: allow_other_term
        label: Nabídnout volbu Jiný termín
        type: boolean
        required: true

      - name: slots
        label: Termíny
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date} · {fruit} · {status}"
        fields:
          - name: visible
            label: Zobrazit termín
            type: boolean
            required: true
            description: Vypnutý termín zůstane uložený, ale návštěvníci jej neuvidí.

          - name: date
            label: Datum
            type: date
            required: true
            options:
              format: yyyy-MM-dd

          - name: start
            label: Čas od
            type: string
            required: true
            description: Zapisujte ve formátu 08:00.
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: Použijte čas ve formátu 08:00.

          - name: end
            label: Čas do
            type: string
            required: true
            description: Zapisujte ve formátu 11:30.
            pattern:
              regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              message: Použijte čas ve formátu 11:30.

          - name: fruit
            label: Ovoce
            type: select
            required: true
            options:
              values:
                - name: Jablka
                  label: Jablka
                - name: Meruňky
                  label: Meruňky
                - name: Černý rybíz
                  label: Černý rybíz
                - name: Švestky
                  label: Švestky
                - name: Jiné
                  label: Jiné

          - name: status
            label: Stav termínu
            type: select
            required: true
            options:
              values:
                - name: preliminary
                  label: Předběžný – čeká na potvrzení zralosti
                - name: open
                  label: Otevřený – lze rezervovat
                - name: full
                  label: Obsazený
                - name: closed
                  label: Rezervace uzavřena
                - name: cancelled
                  label: Zrušený

          - name: note
            label: Krátká poznámka ke stavu
            type: string
            description: Například Termín podle zralosti. Prázdné pole použije výchozí text podle stavu.
            options:
              maxlength: 90

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: "Aktualizace obsahu webu"
